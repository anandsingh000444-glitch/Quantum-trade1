() => clearInterval(iv);\n  }, []);\n\n  return {crypto,forex,indices,fg,ws};\n}\n\n// \u2500\u2500 MINI SVG CHARTS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction Spark({data=[],color='#00A3FF',h=40}) {\n  if (data.length < 2) return null;\n  const min=Math.min(...data),max=Math.max(...data),range=max-min||1;\n  const W=200;\n  const pts=data.map((v,i)=>[(i/(data.length-1))*W, h-((v-min)/range)*(h-4)-2]);\n  const line=pts.map(p=>p.join(',')).join(' ');\n  const area='M'+pts[0].join(',')+'L'+pts.map(p=>p.join(',')).join('L')+'L'+W+','+h+'L0,'+h+'Z';\n  const id='sp'+Math.random().toString(36).slice(2);\n  return e('svg',{viewBox:`0 0 ${W} ${h}`,style:{width:'100%',height:h},preserveAspectRatio:'none'},\n    e('defs',null,\n      e('linearGradient',{id,x1:'0',y1:'0',x2:'0',y2:'1'},\n        e('stop',{offset:'0%',stopColor:color,stopOpacity:'0.28'}),\n        e('stop',{offset:'100%',stopColor:color,stopOpacity:'0'})\n      )\n    ),\n    e('path',{d:area,fill:`url(#${id})`}),\n    e('polyline',{points:line,fill:'none',stroke:color,strokeWidth:'2',strokeLinecap:'round',strokeLinejoin:'round'}),\n    e('circle',{cx:pts[pts.length-1][0],cy:pts[pts.length-1][1],r:'3',fill:color},\n      e('animate',{attributeName:'r',values:'3;5;3',dur:'2s',repeatCount:'indefinite'})\n    )\n  );\n}\n\nfunction Ring({value=0,size=54,color='#00A3FF',label=''}) {\n  const v=clamp(value,0,100);\n  const r=(size-10)/2;\n  const circ=2*Math.PI*r;\n  const off=circ-(v/100)*circ;\n  return e('div',{style:{display:'flex',flexDirection:'column',alignItems:'center',gap:4}},\n    e('svg',{width:size,height:size},\n      e('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:'rgba(255,255,255,.04)',strokeWidth:5}),\n      e('circle',{cx:size/2,cy:size/2,r,fill:'none',stroke:color,strokeWidth:5,\n        strokeDasharray:circ,strokeDashoffset:off,strokeLine .5);\n  const t2=bias==='Bullish'?ent*(1+slP*2.8):ent*(1-slP*2.8);\n  const t3=bias==='Bullish'?ent*(1+slP*4.2):ent*(1-slP*4.2);\n  const conf=Math.floor(rnd(65,97));\n  const dec=price>=1000?2:price>=10?3:5;\n  return {sym,price,bias,setup:setups[Math.floor(rnd(0,setups.length))],\n    entry:ent.toFixed(dec),sl:sl.toFixed(dec),t1:t1.toFixed(dec),t2:t2.toFixed(dec),t3:t3.toFixed(dec),\n    conf,prob:Math.floor(conf*0.91),rr:(Math.abs(t2-ent)/Math.abs(sl-ent)).toFixed(1)+':1',time:nowT()};\n}\n\nfunction Signals({crypto,indices}) {\n  const [step,    setStep]    = useState('choose');\n  const [sigType, setSigType] = useState(null);\n  const [assetId, setAssetId] = useState('ALL');\n  const [dir,     setDir]     = useState('ALL');\n  const [minConf, setMinConf] = useState(70);\n  const [sigs,    setSigs]    = useState([]);\n  const [busy,    setBusy]    = useState(false);\n\n  const sel = SIG_TYPES.find(t=>t.id===sigType);\n\n  const build = useCallback(() => {\n    const all=[\n      {sym:'NIFTY',price:indices.NIFTY?.price||22847,cat:'nifty'},\n      {sym:'BANKNIFTY',price:indices.BANKNIFTY?.price||48320,cat:'nifty'},\n      ...Object.entries(crypto).slice(0,5).map(([k,v])=>({sym:k,price:v.price,cat:'crypto'})),\n      {sym:'EURUSD',price:1.0824,cat:'forex'},\n      {sym:'XAUUSD',price:indices.GOLD?.price||2341,cat:'commo'},\n    ];\n    const asset=ASSETS.find(a=>a.id===assetId);\n    const pool=asset?.cat?all.filter(a=>a.cat===asset.cat):all;\n    return pool.map(a=>genSig(a.price,a.sym,sigType));\n  },[crypto,indices,sigType,assetId]);\n\n  const generate=async()=>{setBusy(true);await slp(800);setSigs(build());setStep('view');setBusy(false);};\n  const list=sigs.filter(s=>dir==='ALL'||(dir==='BUY'?s.bias==='Bullish':s.bias==='Bearish')).filter(s=>s.conf>=minConf);\n\n  if (step==='choose') return e('div',{className:'fu'},\n    e('div',{style:{textAlign:'center',padding:'14px 0 22px'}},\n      e('div',{style:{fontFamily:'var(--display)',fontSize:10,color:'var(--acc       return e('div',{key:k,className:'card cp',style:{borderTop:`2px solid ${up?'var(--green)':'var(--red)'}`}},\n          e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}},\n            e('div',{style:{fontFamily:'var(--display)',fontSize:12,fontWeight:700}},k),\n            e('span',{className:'tag t-live',style:{fontSize:7}},'BINANCE')\n          ),\n          e('div',{style:{fontFamily:'var(--mono)',fontSize:17,fontWeight:700}},'$'+v.price.toLocaleString(undefined,{maximumFractionDigits:dec})),\n          e('div',{style:{fontFamily:'var(--mono)',fontSize:11,color:up?'var(--green)':'var(--red)',marginTop:4,marginBottom:8}},pct(v.chg)+' 24h'),\n          Spark({data:sparkD,color:up?'#00FF88':'#FF4D4D',h:36}),\n          e('div',{style:{marginTop:9,display:'grid',gridTemplateColumns:'1fr 1fr',gap:6}},\n            [['Vol',v.vol||'-'],['High',v.high?'$'+Number(v.high).toLocaleString(undefined,{maximumFractionDigits:2}):'-']].map(([l,val])=>\n              e('div',{key:l,style:{background:'rgba(255,255,255,.03)',borderRadius:6,padding:'6px 9px'}},\n                e('div',{className:'lbl',style:{fontSize:8}},l),\n                e('div',{style:{fontFamily:'var(--mono)',fontSize:10,fontWeight:600,marginTop:2}},val)\n              )\n            )\n          )\n        );\n      })\n    )\n  );\n}\n\n// \u2500\u2500 FOREX \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction Forex({forex}) {\n  const pairs=[\n    {pair:'EUR/USD',price:forex.EUR?.toFixed(5)||'1.08240',sess:'London'},\n    {pair:'GBP/USD',price:forex.GBP?.toFixed(5)||'1.27640',sess:'London'},\n    {pair:'USD/JPY',price:forex.JPY?.toFixed(3)||'156.840',sess:'Tokyo'},\n    {pair:'USD/INR',price:forex.INR?.toFixed(2)||'83.42',sess:'India'},\n    {pair:'AUD/U ontFamily:'var(--mono)',fontSize:18,fontWeight:700,color:c,marginTop:5}},v),\n          e('div',{style:{fontSize:11,color:'var(--muted)',marginTop:3}},s)\n        )\n      )\n    ),\n    e('div',{className:'sect'},'Live Option Chain - NIFTY'),\n    e('div',{style:{overflowX:'auto'}},\n      e('table',{className:'tbl'},\n        e('thead',null,e('tr',null,\n          e('th',{style:{color:'var(--green)'}},'CE OI'),e('th',{style:{color:'var(--green)'}},'CE IV'),e('th',{style:{color:'var(--green)'}},'CE Prem'),\n          e('th',{style:{textAlign:'center',color:'var(--accent)'}},'STRIKE'),\n          e('th',{style:{color:'var(--red)'}},'PE Prem'),e('th',{style:{color:'var(--red)'}},'PE IV'),e('th',{style:{color:'var(--red)'}},'PE OI')\n        )),\n        e('tbody',null,\n          OC.map((row,i)=>{\n            const isAtm=row.s===atm;\n            return e('tr',{key:i,style:{background:isAtm?'rgba(0,163,255,.07)':''}},\n              e('td',null,e('div',{style:{display:'flex',alignItems:'center',gap:5}},\n                e('div',{className:'bar-t',style:{width:55}},e('div',{className:'bar-f',style:{width:(row.ceOI/maxOI*100)+'%',background:'rgba(0,255,136,.5)'}})),\n                e('span',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)'}},(row.ceOI/1000).toFixed(0)+'K')\n              )),\n              e('td',{style:{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:11}},row.ceIV+'%'),\n              e('td',{style:{fontFamily:'var(--mono)',color:'var(--green)',fontWeight:700,fontSize:14}},row.cePrem),\n              e('td',{style:{textAlign:'center',fontFamily:'var(--display)',fontWeight:700,fontSize:12,color:isAtm?'var(--accent)':'var(--text)'}},row.s.toLocaleString(),isAtm?e('span',{style:{fontSize:9,color:'var(--gold)',marginLeft:3}},'ATM'):''),\n              e('td',{style:{fontFamily:'var(--mono)',color:'var(--red)',fontWeight:700,fontSize:14}},row.pePrem),\n              e('td',{style:{fontFamily:'var(--mono)',color:'var(--accent)',fontSize:11}},row.peIV+'%'),\n              e('td',null,e('div',{style:{display:'flex',alignItems:'center',gap:5}},\n                e('span',{style:{fontFamily:'var(--mono)',fontSize:10,color:'var(--muted)'}},(row.peOI/1000).toFixed(0)+'K'),\n                e('div',{className:'bar-t',style:{width:55}},e('div',{className:'bar-f',style:{width:(row.peOI/maxOI*100)+'%',background:'rgba(255,77,77,.5)'}}))\n              ))\n            );\n          })\n        )\n      )\n    )\n  );\n}\n\n// \u2500\u2500 NEWS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nconst NEWS_CATS=[\n  {id:'india',label:'India',q:'NIFTY OR NSE OR RBI OR Sensex'},\n  {id:'crypto',label:'Crypto',q:'Bitcoin OR Ethereum OR crypto OR BTC'},\n  {id:'forex',label:'Forex',q:'forex OR dollar OR Fed OR EURUSD'},\n  {id:'global',label:'Global',q:'stock market OR inflation OR recession'},\n  {id:'gold',label:'Gold',q:'gold price OR XAUUSD OR silver'},\n];\nconst FALLBACK_NEWS=[\n  {id:'f1',title:'RBI Monetary Policy - Rate Decision Expected',desc:'RBI expected to hold at 6.5%. Dovish tone signals liquidity support.',time:'1m ago',src:'Economic Times',impact:'HIGH',asset:'NIFTY',plan:'BANKNIFTY breakout above 48,500. Buy CE above 48,300. SL: 47,900.'},\n  {id:'f2',title:'Bitcoin Holds Above $68,000 - Institutional Demand Strong',desc:'BTC consolidates as ETF inflows hit monthly high.',time:'15m ago',src:'CoinDesk',impact:'HIGH',asset:'BTC',plan:'BTC long above $68,500. Target $72,000. SL: $66,800.'},\n  {id:'f3',title:'US Non-Farm Payrolls Due Today - Consensus +185K',desc:'NFP data. Miss could weaken USD and trigger Gold/BTC rally.',time:'1h ago',src:'Reuters',impact:'HIGH',asset:'FOREX',plan:'Avoid EURUSD 30 min before release. Trade breakout after.'},\n  {id:'f4',title:'Gold Consolidates Near $2,340 Ahead of Fed Minutes',desc:'XAUUSD holds key support ahead of FOMC minutes release.',time:'2h ago',src:'Kitco',impact:'MED',asset:'GOLD',plan:'Gold long above $2,350. Target $2,390. SL: $2,310.'},\n  {id:'f5',title:'India CPI at 4.2% - Within RBI Comfort Zone',desc:'Inflation data inline with estimates, markets react positively.',time:'3h ago',src:'Mint',impact:'MED',asset:'NIFTY',plan:'NIFTY positive bias. Watch FMCG and auto sector for longs.'},\n];\n\nfunction News({crypto,indices}) {\n  const [cat,setCat]=useState('india');\n  const [arts,setArts]=useState(FALLBACK_NEWS);\n  const [loading,setLoading]=useState(false);\n  const [apiOk,setApiOk]=useState(false);\n  const [expanded,setExpanded]=useState(null);\n  const [aiRes,setAiRes]=useState({});\n  const [aiLoading,setAiLoading]=useState({});\n\n  useEffect(()=>{\n    let alive=true;\n    const load=async()=>{\n      setLoading(true);\n      const q=NEWS_CATS.find(c=>c.id===cat)?.q||'stock market';\n      const url=`https://newsapi.org/v2/everything?q=${encodeURIComponent(q)}&language=en&sortBy=publishedAt&pageSize=12&apiKey=${NEWS_KEY}`;\n      try {\n        const r=await fetch('https://corsproxy.io/?'+encodeURIComponent(url),{signal:AbortSignal.timeout(10000)});\n        const d=await r.json();\n        if(d?.status==='error') throw new Error(d.message);\n        const a=(d?.articles||[]).filter(a=>a.title&&a.title!=='[Removed]').map((a,i)=>({\n          id:cat+i,title:a.title||'',desc:a.description||'',\n          time:new Date(a.publishedAt).toLocaleTimeString('en-IN',{hour12:true,hour:'2-digit',minute:'2-digit'}),\n          src:a.source?.name||'News',url:a.url||'#',\n          impact:(a.title+a.description).match(/RBI|Fed|rate|GDP|crash|NFP|FOMC/i)?'HIGH':(a.title+a.description).match(/earnings|IPO|FII|quarterly/i)?'MED':'LOW',\n          asset:(a.title+a.description).match(/NIFTY|NSE|BSE|RBI/i)?'NIFTY':(a.title+a.description).match(/Bitcoin|BTC|crypto/i)?'BTC':(a.title+a.description).match(/gold|XAUUSD/i)?'GOLD':'MARKET',\n          plan:null,\n        }));\n        if(alive&&a.length>0){setArts(a);setApiOk(true);}\n      } catch { if(alive){setArts(FALLBACK_NEWS);setApiOk(false);} }\n      if(alive) setLoading(false);\n    };\n    load();\n    return ()=>{alive=false;};\n  },[cat]);\n\n  const analyze=async(art)=>{\n    setAiLoading(p=>({...p,[art.id]:true}));\n    try{\n      const r=await fetch('https://api.anthropic.com/v1/messages',{\n        method:'POST',headers:{'Content-Type':'application/json'},\n        body:JSON.stringify({\n          model:'claude-sonnet-4-20250514',max_tokens:350,\n          system:`You are TradeX AI. Live: NIFTY ${indices?.NIFTY?.price?.toFixed(0)||22847}, BTC $${crypto?.BTC?.price?.toFixed(0)||68540}. Analyze news in 3 lines: 1) What happened 2) Market impact 3) Trade plan with entry/SL/target. Be specific. Max 100 words.`,\n          messages:[{role:'user',content:`${art.title}\\n${art.desc}`}]\n        })\n      });\n      const d=await r.json();\n      const txt=d.content?.map(c=>c.text||'').join('')||'Analysis failed.';\n      setAiRes(p=>({...p,[art.id]:txt}));\n    }catch{setAiRes(p=>({...p,[art.id]:'AI connection error.'});}\n    setAiLoading(p=>({...p,[art.id]:false}));\n  };\n\n  const impC={'HIGH':'var(--red)','MED':'var(--gold)','LOW':'var(--accent)'};\n  const impTag={'HIGH':'t-hi','MED':'t-md','LOW':'t-lo'};\n\n  return e('div',{className:'fu'},\n    e('div',{style:{background:apiOk?'rgba(0,255,136,.05)':'rgba(255,184,0,.05)',border:`1px solid ${apiOk?'rgba(0,255,136,.2)':'rgba(255,184,0,.2)'}`,borderRadius:9,padding:'9px 13px',marginBottom:12,fontSize:11,color:apiOk?'var(--green)':'var(--gold)'}},\n      apiOk?'Live news from NewsAPI.org - '+arts.length+' articles':'Static fallback - NewsAPI loading via proxy'\n    ),\n    e('div',{style:{display:'flex',gap:5,flexWrap:'wrap',marginBottom:12}},\n      NEWS_CATS.map(c=>e('div',{key:c.id,className:'tab'+(cat===c.id?' on':''),onClick:()=>setCat(c.id)},c.label)),\n      e('bu type,sym:a.sym,zone:`${(a.price*.997).toFixed(dec)} - ${(a.price*1.002).toFixed(dec)}`,bias,strength:['High','Strong','Medium','Weak'][Math.floor(rnd(0,4))],updated:nowT()};\n    });\n    setZones(build());\n    const iv=setInterval(()=>setZones(prev=>prev.map(z=>({...z,updated:nowT()}))),12000);\n    return()=>clearInterval(iv);\n  },[]);\n  const TC={'FVG':'var(--accent)','IFVG':'var(--purple)','Order Block':'var(--gold)','BOS Retest':'var(--green)','CHOCH':'var(--red)','MSS':'var(--gold)','BSL':'var(--green)','SSL':'var(--red)','Breaker Block':'#FF6B35','Mitigation Block':'var(--purple)','Liquidity Sweep':'#FF6B35'};\n  return e('div',{className:'fu'},\n    e('div',{className:'g4',style:{marginBottom:14}},\n      [['FVG/IFVG',9,'Value Gaps'],['Order Blocks',6,'Unmitigated'],['Liquidity',7,'Sweeps'],['BOS/CHOCH',4,'Structure']].map(([t,c,d])=>\n        e('div',{key:t,className:'card cp',style:{textAlign:'center'}},\n          e('div',{style:{fontFamily:'var(--display)',fontSize:28,fontWeight:900,color:'var(--accent)'}},c),\n          e('div',{style:{fontWeight:600,marginTop:3,fontSize:13}},t),\n          e('div',{style:{fontSize:10,color:'var(--muted)',marginTop:2}},d+' detected')\n        )\n      )\n    ),\n    e('div',{className:'sect'},'Active SMC Zones'),\n    e('div',{style:{display:'grid',gap:8}},\n      zones.map((z,i)=>{\n        const c=TC[z.type]||'var(--accent)';\n        return e('div',{key:i,className:'card',style:{display:'flex',alignItems:'center',gap:12,padding:'12px 15px'}},\n          e('div',{style:{width:50,height:50,borderRadius:10,background:c+'14',border:`1px solid ${c}30`,display:'flex',alignItems:'center',justifyContent:'center',fontFamily:'var(--display)',fontSize:7.5,fontWeight:700,color:c,textAlign:'center',padding:4,flexShrink:0,lineHeight:1.3}},z.type),\n          e('div',{style:{flex:1}},\n            e('div',{style:{display:'flex',justifyContent:'space-between',alignItems:'center'}},\n              e('span',{style:{fontWeight:700,f tegory','Price','24h Chg','Signal','Source'].map(h=>e('th',{key:h},h)))),\n        e('tbody',null,\n          filtered.map((item,i)=>{\n            const up=item.chg>=0;\n            const dec=item.price>=10000?0:item.price>=1000?2:item.price>=10?3:5;\n            return e('tr',{key:i},\n              e('td',{style:{fontFamily:'var(--display)',fontSize:10,fontWeight:700}},item.sym),\n              e('td',null,e('span',{className:'tag',style:{background:'rgba(255,255,255,.04)',color:'var(--muted)',border:'1px solid rgba(255,255,255,.08)',fontSize:8}},item.cat)),\n              e('td',{style:{fontFamily:'var(--mono)',fontWeight:600}},item.price.toLocaleString(undefined,{maximumFractionDigits:dec})),\n              e('td',{style:{fontFamily:'var(--mono)',fontSize:11,color:up?'var(--green)':'var(--red)'}},pct(item.chg)),\n              e('td',null,e('span',{className:'tag '+(up?'t-buy':'t-sell')},up?'BUY':'SELL')),\n              e('td',{style:{fontSize:10,color:item.src==='Binance'?'var(--green)':'var(--gold)'}},item.src)\n            );\n          })\n        )\n      )\n    )\n  );\n}\n\n// \u2500\u2500 ANALYTICS \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\nfunction Analytics() {\n  const eq=[42000,41200,43800,44600,42900,46200,47100,45800,48300,49700,51200,52800];\n  const pl=[-400,1200,2600,-800,3200,900,2100,-1200,4100,1800,3600,1500];\n  const mo=['Jun','Jul','Aug','Sep','Oct','Nov','Dec','Jan','Feb','Mar','Apr','May'];\n  const maxPl=Math.max(...pl.map(Math.abs),1);\n  const minEq=Math.min(...eq),maxEq=Math.max(...eq),rngEq=maxEq-minEq||1;\n  const W=600,H=110;\n  const pts=eq.map((v,i)=>[(i/(eq.length-1))*W,H-((v-minEq)/rngEq)*(H-10)-5]);\n  const line=pts.map(p=>p.join(',')).join(' ');\n  const area='M'+pts[0].join(',')+'L'+pts.map(p=>p.join(',')).join('L')+'L'+W+','+H+'L0,'+H+'Z';\n  return e('div',{className:'fu'},\n    e('div',{className:'g2',style:{marginBottom:14}},\n      e('div',{className:'card cp'},\n        e('div',{className:'sect'},'Equity Curve'),\n        e('svg',{viewBox:`0 0 ${W} ${H}`,style:{width:'100%',height:H},preserveAspectRatio:'none'},\n          e('defs',null,e('linearGradient',{id:'eqg',x1:'0',y1:'0',x2:'0',y2:'1'},\n            e('stop',{offset:'0%',stopColor:'#00FF88',stopOpacity:'.3'}),\n            e('stop',{offset:'100%',stopColor:'#00FF88',stopOpacity:'0'})\n          )),\n          e('path',{d:area,fill:'url(#eqg)'}),\n          e('polyline',{points:line,fill:'none',stroke:'#00FF88',strokeWidth:'2.5',strokeLinecap:'round'})\n        ),\n        e('div',{style:{display:'flex',justifyContent:'space-between',marginTop:7}},\n          e('span',{style:{fontSize:10,color:'var(--muted)'}},'Jun 2025'),\n          e('span',{style:{fontSize:11,color:'var(--green)',fontFamily:'var(--mono)',fontWeight:700}},'+Rs '+(eq[11]-eq[0]).toLocaleString()+' (+25.7%)'),\n          e('span',{style:{fontSize:10,color:'var(--muted)'}},'May 2026')\n        )\n      ),\n      e('div',{className:'card cp'},\n        e('div',{className:'sect'},'Monthly P&L'),\n        e('div',{style:{display:'flex',alignItems:'flex-end',gap:4,height:100}},\n          pl.map((v,i)=>e('div',{key:i,style:{flex:1,display:'flex',flexDirection:'column',alignItems:'center',gap:3}},\n            e('div',{style:{width:'100%',borderRadius:'3px 3px 0 0',background:v>=0?'linear-gradient(180deg,#00FF88,#00cc6a)':'linear-gradient(180deg,#FF4D4D,#cc3333)',height:Math.max(3,(Math.abs(v)/maxPl)*86)+'px',opacity:.85}}),\n            e('span',{style:{fontSize:8,color:'var(--muted)',whiteSpace:'nowrap'}},mo[i])\n          ))\n        )\n      )\n    ),\n    e('div',{className:'g4'},\n      [['Sharpe','2.14','var(--accent)'],['Max DD','-8.4%','var(--red)'],['Profit Factor','2.68','var(--green)'],['Win Rate','68%','var(--green)'],['Total Trades','124','var(--text)'],['Avg Win','Rs 500\u2500\u2500\u2500\u2500\nfunction App() {\n  const [user,setUser]=useState(null);\n  const [page,setPage]=useState('dashboard');\n  const {crypto,forex,indices,fg,ws}=useLiveData();\n\n  const tickers=[\n    ...Object.entries(crypto).slice(0,5).map(([k,v])=>({sym:k,price:v.price>=1000?v.price.toLocaleString(undefined,{maximumFractionDigits:0}):v.price.toFixed(4),chg:v.chg})),\n    ...Object.entries(indices).slice(0,5).map(([k,v])=>({sym:k,price:v.price.toLocaleString(undefined,{maximumFractionDigits:0}),chg:v.chg})),\n    {sym:'EUR/USD',price:forex.EUR?.toFixed(5)||'1.08240',chg:rnd(-0.1,0.1)},\n    {sym:'F&G',price:fg+'/100',chg:0,special:fg>=55?'GREED':fg>=45?'NEUTRAL':'FEAR',spC:fg>=55?'var(--green)':fg>=45?'var(--gold)':'var(--red)'},\n    {sym:'VIX',price:'13.42',chg:-2.1},\n    {sym:'DXY',price:'104.82',chg:-0.14},\n  ];\n  const doubled=[...tickers,...tickers];\n\n  const wsColor=ws==='live'?'var(--green)':'var(--gold)';\n  const wsLabel=ws==='live'?'BINANCE LIVE':ws==='sim'?'LIVE (SIM)':'CONNECTING';\n  const wsCls=ws==='live'?'pill pill-g':'pill pill-y';\n\n  const p={crypto,forex,indices,fg,ws,user};\n\n  const renderPage=()=>{\n    switch(page){\n      case 'dashboard': return e(Dashboard,p);\n      case 'chart':     return e(Charts,null);\n      case 'signals':   return e(Signals,p);\n      case 'smc':       return e(SMC,p);\n      case 'options':   return e(Options,p);\n      case 'forex':     return e(Forex,p);\n      case 'crypto':    return e(Crypto,p);\n      case 'watchlist': return e(Watchlist,p);\n      case 'journal':   return e(Journal,null);\n      case 'analytics': return e(Analytics,null);\n      case 'risk':      return e(Risk,null);\n      case 'news':      return e(News,p);\n      case 'ai':        return e(AI,p);\n      default:          return e(Dashboard,p);\n    }\n  };\n\n  if (!user) return e(Auth,{onLogin:setUser});\n\n  return e('div',null,\n    e('style',null,CSS),\n    e('div',{className:'bgrid'}),\n    e('div',{className:'app'},\n      // SIDEBAR\n      e('nav',{className:'sb'},\n        e('div',{className:'logo-w',onClick:()=>setPage('dashboard')},\n          e('div',{className:'logo-t'},'TQ'),\n          e('div',{className:'logo-s'},'QUANTUM')\n        ),\n        e('div',{className:'nav-l'},\n          NAV.map(n=>e('div',{key:n.id,className:'nb'+(page===n.id?' on':''),onClick:()=>setPage(n.id),style:{position:'relative'}},\n            e('div',{className:'nb-ic'},NAV_ICONS[n.icon]||'\u2022'),\n            e('div',{className:'nb-lb'},n.short)\n          ))\n        ),\n        e('div',{className:'sb-bot'},\n          e('div',{className:'ava',onClick:()=>setUser(null),title:'Logout'},user.email?.[0]?.toUpperCase()||'T')\n        )\n      ),\n      // MAIN\n      e('div',{className:'main'},\n        // TICKER BAR\n        e('div',{className:'tkbar'},\n          e('div',{className:'tk-lbl'},'LIVE'),\n          e('div',{className:'tk-scroll'},\n            e('div',{className:'tk-track'},\n              doubled.map((t,i)=>e('div',{key:i,className:'ti',onClick:()=>setPage(t.sym==='BTC'||t.sym==='ETH'||t.sym==='SOL'?'crypto':t.sym==='NIFTY'||t.sym==='BANKNIFTY'?'dashboard':'dashboard')},\n                e('span',{className:'ti-s'},t.sym),\n                e('span',{className:'ti-p'},t.price),\n                t.special\n                  ? e('span',{className:'ti-c',style:{color:t.spC,marginLeft:5}},t.special)\n                  : e('span',{className:'ti-c',style:{color:t.chg>=0?'var(--green)':'var(--red)'}},pct(t.chg))\n              ))\n            )\n          )\n        ),\n        // TOPBAR\n        e('div',{className:'topbar'},\n          e('div',{className:'tb-brand',onClick:()=>setPage('dashboard')},'TradeX Quantum AI'),\n          e('div',{className:'tb-sep'}),\n          e('div',{className:wsCls},\n            e('div',{className:'ldot ldot-'+(ws==='live'?'g':'y')}),\n            wsLabel\n          ),\n          e('div',{className:'ava',onClick:()=>setUser(null),title:'Logout'},user.email?.[0]?.toUpperCase()||'T')\n        ),\n        // PAGE\n        e('div',{className:'page',key:page},renderPage())\n      )\n    )\n  );\n}\n\nReactDOM.createRoot(document.getElementById('root')).render(e(App));\n\"\"\";\n\nPYEOF\necho \"app_js length: ${#app_js}\"\n\npython3 << 'PYEOF'\n# Read the JS we built\nwith open('/tmp/build_app.py', 'r') as f:\n    content = f.read()\n\n# Extract just the JS between the quotes\nstart = content.index('app_js = r\"\"\"') + len('app_js = r\"\"\"')\nend = content.rindex('";</script>
