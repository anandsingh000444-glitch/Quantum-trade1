<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<meta name="theme-color" content="#070B14"/>
<title>TradeX Quantum AI</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=DM+Sans:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#070B14}
body{color:#E8EDF5;font-family:"DM Sans",sans-serif}
#root{min-height:100vh}
#ld{position:fixed;inset:0;background:#070B14;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:99999;min-height:100vh;width:100%}
.logo{font-family:Orbitron,sans-serif;font-size:28px;font-weight:900;background:linear-gradient(135deg,#00A3FF,#A855F7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:8px;text-align:center}
.sub{font-size:11px;color:#5A6A85;letter-spacing:3px;margin-bottom:32px;text-align:center}
.bar{width:240px;height:4px;background:rgba(255,255,255,.08);border-radius:4px;overflow:hidden;margin-bottom:12px}
.fill{height:100%;background:linear-gradient(90deg,#00A3FF,#A855F7);width:0;border-radius:4px;transition:width .4s}
.msg{font-size:12px;color:#5A6A85;text-align:center;margin-bottom:8px}
.err{color:#FF4D4D;font-size:12px;max-width:90vw;text-align:center;margin-top:16px;line-height:1.7;display:none;padding:0 20px;word-break:break-word}
.rbtn{background:rgba(0,163,255,.15);border:1px solid rgba(0,163,255,.3);color:#00A3FF;padding:12px 32px;border-radius:10px;font-size:14px;font-weight:700;cursor:pointer;margin-top:16px;display:none;font-family:inherit}
.dots{display:flex;gap:8px;margin-top:16px}
.dot{width:8px;height:8px;border-radius:50%;background:#00A3FF;animation:dp 1.2s ease-in-out infinite}
.dot:nth-child(2){animation-delay:.2s;background:#A855F7}
.dot:nth-child(3){animation-delay:.4s;background:#00FF88}
@keyframes dp{0%,100%{opacity:.25;transform:scale(.7)}50%{opacity:1;transform:scale(1.2)}}
</style>
</head>
<body>
<div id="ld">
  <div class="logo">TradeX Quantum AI</div>
  <div class="sub">INSTITUTIONAL GRADE INTELLIGENCE</div>
  <div class="bar"><div class="fill" id="fill"></div></div>
  <div class="msg" id="msg">Starting...</div>
  <div class="dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>
  <div class="err" id="err"></div>
